# 查重引擎本地依赖服务。
# 启动：docker compose up -d
# Qdrant 向量库供 Layer 2（embed）ANN 召回使用。
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: clone-detection-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST / Web UI: http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./data/db/qdrant:/qdrant/storage
