# GitLab CI：查重引擎单元测试 + 评测回归基线。
stages: [test, eval]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/
    - .hf-cache/

default:
  image: python:3.12
  before_script:
    - python -m pip install -U pip
    - pip install -r requirements.txt

unit-tests:
  stage: test
  script:
    # 依赖 codet5p 模型的用例在离线环境会自动 skip
    - python -m pytest tests/ -q -p no:cacheprovider

eval-regression:
  stage: eval
  variables:
    HF_HOME: "$CI_PROJECT_DIR/.hf-cache"
  script:
    - git clone --depth 1 https://github.com/rcore-os/rCore-Tutorial-v3 data/repos/rcore/v3
    - python -m src.normalize --repo data/repos/rcore/v3 --repo-id rcore/v3 --db data/db/functions.db
    - python -m src.embed --qdrant-path data/db/qdrant_local build --all --db data/db/functions.db
    - python -m src.simhash --idf data/db/idf.json --index data/db/simhash_index.pkl build --db data/db/functions.db
    - python -m tests.evaluation.synthesize --per-class 15 --out tests/fixtures/eval_set.json
    # T1/T2 最终召回 < 0.95 或 T3 < 0.80 → 失败
    - python -m tests.evaluation.run --check
  artifacts:
    when: always
    paths:
      - tests/evaluation/history/
