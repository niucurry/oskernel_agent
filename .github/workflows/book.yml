name: book

on:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - ".github/workflows/book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署，避免并发发布互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          # 固定版本：book.toml 按 mdBook 0.5 的配置结构编写
          mdbook-version: "v0.5.4"

      - name: Build book
        run: mdbook build docs/book

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
