name: clone-detection-ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Run unit tests
        # 依赖 codet5p 模型的用例在离线环境会自动 skip
        run: python -m pytest tests/ -q -p no:cacheprovider

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline
          npm run build

  eval-regression:
    runs-on: ubuntu-latest
    # 评测需要嵌入模型与向量库，较重；仅在主干/特性分支跑小型集
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-codet5p-110m
      - name: Build small historical index
        run: |
          git clone --depth 1 https://github.com/rcore-os/rCore-Tutorial-v3 data/repos/rcore/v3
          python -m oskernel_agent.comparison.normalize --repo data/repos/rcore/v3 --repo-id rcore/v3 --db data/db/functions.db
          python -m oskernel_agent.comparison.embed --qdrant-path data/db/qdrant_local build --all --db data/db/functions.db
          python -m oskernel_agent.comparison.simhash --idf data/db/idf.json --index data/db/simhash_index.pkl build --db data/db/functions.db
      - name: Synthesize small eval set
        run: python -m tests.evaluation.synthesize --per-class 15 --out tests/fixtures/eval_set.json
      - name: Run evaluation with regression gate
        # T1/T2 最终召回 < 0.95 或 T3 < 0.80 → 失败
        run: python -m tests.evaluation.run --check
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: tests/evaluation/history/
