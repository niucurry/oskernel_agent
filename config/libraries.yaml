# 复用的公开第三方库（被各队 vendored 进内核的库代码）。
#
# 命中即判「库复用」：这类代码是公开库的整库签入，多队合法共用，**不计入值得关注的
# 借鉴/抄袭**——报告里会从「主要借鉴来源」图、各模块借鉴占比/清单、原创代码清单、
# 文件级清单中剔除，另单列「复用库统计」小节呈现。
#
# 识别规则（见 src/report/libraries.py · match_library）：把文件路径分隔符与大小写归一后，
#   1) 若任一目录段 ∈ vendor_dirs（vendor/third_party/…），取其下一段为库名（结构兜底，
#      自动覆盖 cargo vendor 出来的全部 crate）；
#   2) 否则若任一目录段 == 某库的 segments 之一，则判为该库。可能同时表示业务模块的短名称
#      可放入 context_required_segments；它们只有位于 crates/libs/deps 等依赖布局，或自身就是
#      <crate>/src/... 根布局时才命中，避免把 src/arch/riscv 等自研代码当第三方库。
# 新库在此补充 segments 即可，无需改代码。
#
# 种子来自 config/baselines.yaml 已登记的 vendored 库（lwext4/rust-fatfs/virtio-drivers）
# + 用户点名的 smoltcp + 实测语料里常见的 crate。
libraries:
  - name: lwext4
    segments: [lwext4, lwext4_rust]
  - name: smoltcp
    segments: [smoltcp]
  - name: fatfs
    segments: [fatfs, rust-fatfs, rust_fatfs]
    context_required_segments: [fatfs]
  - name: virtio-drivers
    # virtio-drivers-la 是该库的 LoongArch 移植分支（crate name "virtio-drivers-la"），
    # 各队 vendored 时目录名常被改，故一并登记，避免被当成跨队抄袭。
    segments: [virtio-drivers, virtio_drivers, virtio-drivers-la, virtio_drivers_la]
  - name: buddy_system_allocator
    segments: [buddy_system_allocator]
  - name: slab_allocator
    segments: [slab_allocator]
  # rust-embedded 的 riscv 寄存器抽象 crate（github.com/rust-embedded/riscv），多队整库
  # vendored（常见目录名 riscv）。riscv 同时是常见架构目录名，故必须具备依赖包上下文。
  - name: riscv
    segments: [riscv]
    context_required_segments: [riscv]

vendor_dirs: [vendor, third_party, 3rdparty, thirdparty, extern, external]
