# 基线白底库（公共/模板代码：教学 OS、组委会模板）。
# 与 repos.yaml 同结构，可被 src.ingest 拉取；入库后 Qdrant payload 标 is_baseline=true，
# 命中基线只作扣除依据、不计抄袭。
repos:
  - repo_url: https://github.com/rcore-os/rCore-Tutorial-v3
    year: 0
    team_name: baseline_rcore_v3
    award_level: baseline
  - repo_url: https://github.com/mit-pdos/xv6-riscv
    year: 0
    team_name: baseline_xv6_riscv
    award_level: baseline
  - repo_url: https://gitlab.eduxiji.net/template/os-contest-template
    year: 0
    team_name: baseline_contest_template
    award_level: baseline
  # 公共参考 OS（回应待确认#1：压低「复用比例异常高」误报）。
  # 拉取入库：`python -m src.ingest --config config/baselines.yaml`；查询时加 `--baselines` 启用扣除。
  - repo_url: https://github.com/arceos-org/arceos
    year: 0
    team_name: baseline_arceos
    award_level: baseline
  - repo_url: https://github.com/chyyuu/os_kernel_lab
    year: 0
    team_name: baseline_ucore_lab
    award_level: baseline
  - repo_url: https://github.com/rcore-os/rCore
    year: 0
    team_name: baseline_rcore_v1
    award_level: baseline
  # 常被各队 vendored 进内核的第三方库（整库签入，命中即扣除，不计两队互抄）。
  - repo_url: https://github.com/gkostka/lwext4
    year: 0
    team_name: baseline_lwext4
    award_level: baseline
  - repo_url: https://github.com/rafalh/rust-fatfs
    year: 0
    team_name: baseline_rust_fatfs
    award_level: baseline
