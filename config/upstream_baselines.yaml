# 上游基线 / ABI 受限代码 的扣除配置（报告层，与 libraries.yaml 同口径）。
#
# 两类「不应计入内核创新查重」的代码（评审实测暴露的判别缺陷）：
#
# 1. 上游 OS/框架 整库 vendored（upstream_roots）：
#    各队把 ArceOS / rCore 等上游整库签进自己仓库（如 `arceos/`），导致「A 队的
#    arceos/modules/axhal/x.rs」与「B 队的 arceos/modules/axhal/x.rs」逐字相同——
#    这不是跨队抄袭，而是双方都 vendored 了同一份上游。本系统在 metadata 通道2 的
#    「双侧都命中同一上游基线函数」向量扣除因候选侧是「另一队的 vendored 副本」而非
#    上游本身、且各队对副本改动不一，常不触发（baseline_derived=0）；故在此加一条
#    路径只产生上游来源线索（upstream_path_hint）。只有目标函数完整源码 token
#    与显式公共上游参考一致时，才标 upstream_vendored 并从借鉴清单剔除。
#    核对忽略注释和空白，保留名称、常量及字符串；上游文件内的本地修改继续待核对。
#    缺少参考、解析失败或不支持的语言不能据路径排除，也不能因此认定存在借鉴。
#
# 2. 受 Linux/POSIX ABI 限制的唯一性实现（abi_constrained）：
#    `metadata_to_kstat`（按 Linux struct kstat 字段布局转换）、`dummy_stat_fs`、
#    `sys_*` 系统调用 shim、vdso 符号等——字段/签名由 ABI 规范硬性规定，只有一种正确
#    实现，多队写法必然雷同。这类既非 vendored 库、也无单一上游可登记，按**路径 + 函数名**
#    模式识别。口径保守：只收明显的 ABI shim/转换函数，把 trait 样板（from/new/default）
#    与真实 VFS 逻辑留给人工复核，避免把原创信号误降。
#    build.rs / scripts 等构建脚本、工具链也在此一并扣除（非内核创新代码）。

upstream_roots: [arceos, rcore, rcore-v3, xv6-riscv, ucore, os_kernel_lab]

abi_constrained:
  # 无条件路径类别：这些目录本身就是构建、测试、第三方兼容层，而非内核业务实现。
  unconditional_path_globs:
    # 构建脚本与工具链
    - build.rs
    - /scripts/
    - /tools/
    - /deptool/
    - /bwbench_client/      # 基准测试客户端（ArceOS 自带 benchmark）
    - /examples/            # 官方示例 / demo
    - /tests/               # 测试
    - /benches/             # 基准测试
    # C 标准库 / POSIX 兼容层（上游直接注入的底层支持库）
    - /ctypes/
    - /shim/
    - /musl/
    - /libc/
    - /glibc/
    - /axlibc/c/            # ArceOS axlibc 的 C 源码（printf.c/string.c/math.c/stdlib.c…）
    - /vdso/
  # 明确的 ABI 机械转换名称可以直接命中；不包括泛化的 sys_* 系统调用实现。
  name_patterns:
    - "_to_kstat$"
    - "from_kstat$"
    - "_to_stat$"
    - "from_stat$"
    - "^dummy_stat_"
    - "^metadata_to_"
    - "_to_errno$"
    - "errno_to_"
    - "_syscall$"

  # 下列路径/名称仅提供“可能是 ABI 适配器”的上下文；必须再通过短函数、低控制流、
  # 以参数转换/转发为主体的函数体形态检查。复杂系统调用不会只因目录或名称被排除。
  adapter_context_path_globs:
    - api/src/file/
    - api/src/syscall/
  adapter_name_patterns:
    - "^sys_"
    - "robust"
    - "futex"
