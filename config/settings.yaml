# 查重引擎运行配置（src.embed 等模块读取）。

embedding:
  # HuggingFace 模型名；后续可换 UniXcoder 等同类嵌入模型
  model_name: Salesforce/codet5p-110m-embedding
  max_length: 512        # 模型单次最大 token 数
  window_size: 512       # 滑窗大小（超长函数）
  window_stride: 384     # 滑窗步长
  batch_size: 64         # 每批窗口数（原16，改64使GPU利用率从~5%提到~40%）
  device: auto           # auto / cpu / cuda

qdrant:
  # 生产用 docker 起的服务地址；无 docker 时可用本地路径（见 --qdrant-path）
  url: http://localhost:6333
  collection: os_functions

retrieval:
  top_k: 20              # 每个 query 函数召回候选数

metadata:
  string_generic_repo_threshold: 5   # 出现在 > 该数量个不同仓库的字符串视为通用，不索引
  baseline_sim_threshold: 0.85            # 单侧：query 与基线函数相似度 > 此值即判 vendored/紧随上游（保守，单侧证据弱）
  baseline_bilateral_threshold: 0.75      # 双侧：query 与 candidate 命中同一基线函数且两侧均 > 此值 → 共同衍生（信号强，门槛低；实测 remove_timer 双侧 0.826）
  common_code_repo_threshold: 5      # query 函数高相似命中 >= 此数量个不同历史仓库 → 判公共/框架代码
  common_code_sim_threshold: 0.9     # 计入“高相似命中”的向量相似度下限
  contest_start: "2024-05-01"        # 比赛开始日期（用于 commit 早期完整实现信号）
  early_impl_days: 3                 # 引入时间距比赛开始 < 此天数视为可疑
  early_impl_min_lines: 30           # 且函数规模 >= 此行数才算"已是完整实现"
  large_commit_lines: 2000           # 单次新增 > 此行数视为异常大提交
  vague_message_patterns:            # 模糊模板 commit message（正则，大小写不敏感）
    - '^\s*init'
    - '^\s*add\s+files?'
    - '^\s*update'
    - '^\s*first\s+commit'
    - '^\s*commit'
    - '^\s*wip'
    - '^\s*\.+\s*$'

llm:
  # 模型名在此配置；base_url / api_key 从环境变量读（LLM_BASE_URL / LLM_API_KEY）
  model: deepseek-v4-flash
  temperature: 0.3       # 复核投票温度
  votes: 3               # 每个嫌疑对调用次数（多数表决）
  concurrency: 5         # asyncio 并发度
  max_card_tokens: 6000  # 嫌疑卡片 token 上限
  context_lines: 10      # 超长代码保留 matched_spans ± 行数
  request_timeout: 60    # 单次请求超时（秒）
  max_retries: 3         # 网络层重试次数
  min_interval: 0.0      # 相邻请求最小间隔（秒），限速用

ai_detect:
  # AI 生成代码检测（DetectCodeGPT，困惑度/log-rank）。参考模型 14GB，建议在带 GPU 的宿主机
  # 单独运行 `python -m src.ai_detect --repo X`；VM 无模型时该步骤优雅跳过，报告章节给出说明。
  # 打分模型：本系统选定 bigcode/starcoder2-3b（3B/bf16≈6GB，可整模型上 8GB 卡如 RTX 4060；
  # 比 CodeLlama-7b 更轻更快）。首次使用需把权重下到 HF 缓存，之后离线即可加载：
  #   HF_ENDPOINT=https://hf-mirror.com huggingface-cli download bigcode/starcoder2-3b
  # （权重为 fp32≈12GB，加载时按 bf16 上卡只占 ~6GB）。未下到权重时该步骤优雅跳过、报告章节给出说明。
  model_id: bigcode/starcoder2-3b
  device: auto                 # auto / cpu / cuda / mps（loader 用 device_map=auto：放得下整模型上 GPU，放不下自动卸载部分层到 CPU）
  engine: transformers         # transformers / vllm
  batch_size: 8                # 模型前向批大小
  k_perturbations: 20          # Stage 2 每函数扰动次数（P2：50→20，只作用于灰区函数；配合早停+两阶段门，质量影响限于已转人工复核的边界样本）
  min_loc: 20                  # 低于此有效行数的函数判 Uncertain（信号不足）
  # 阈值标定（针对 starcoder2-3b 的实测最佳值；真人 log-rank 均值≈0.625）。
  # 注意：工具原默认 1.5/3.0 不可用——会把几乎所有代码判成 AI。阈值与打分模型强相关，
  # 换模型（如 CodeLlama-7b）必须重新标定，不能照搬这里的值。
  log_rank_llm_threshold: 0.31  # Stage 1：log_rank < 此值 → LLM（高置信，AI 生成）
  log_rank_human_threshold: 0.31 # Stage 1：log_rank > 此值 → Human（高置信，真人）；与上者相等 = 以 0.31 为单一判定线，NPR 仅兜边界
  detect_score_threshold: 0.20  # Stage 2：NPR score > 此值 → LLM（辅助信号）
  git_blame: true              # 是否按作者/月份聚合（git blame）
  suspicious_min_confidence: 0.7 # 进入“高度可疑函数”清单的置信下限
  max_functions: 800           # 固定配额：>0 时只检测前 N 个（排除借鉴后）函数。超大仓库
                               # （如 5000+ 函数）全量检测会让 ai_detect 步耗时数十分钟、触发
                               # 对比报告超时；截断到固定数量后耗时可控（800≈作品1 的量级，约 7 分钟）。
                               # 中小仓库函数数 <800 时不受影响=全量。0=全量。
